# Gera os instaladores do Garimpalo para Mac e Windows.
# Rode em Actions → "Build" → "Run workflow", ou envie uma tag v* (ex.: v0.1.0).
# Os instaladores ficam na Release vX.Y.Z do repositório (aba Releases).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm run tauri build -- ${{ matrix.args }}

      # Publica numa Release (não conta na cota de armazenamento de artifacts).
      - name: Publicar na release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          FILES=$(find src-tauri/target -path '*release/bundle*' \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \))
          [ -n "$FILES" ] || { echo "nenhum instalador encontrado"; exit 1; }
          echo "$FILES"
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Garimpalo $TAG" \
              --notes "Instaladores do Garimpalo para Mac (Apple Silicon e Intel) e Windows." || true
            gh release upload "$TAG" $FILES --clobber && exit 0
            sleep $((i * 5))
          done
          exit 1
