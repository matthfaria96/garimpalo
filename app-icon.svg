    <path d="M722.0 838.7 L726.8 836.0 L733.1 838.4 L734.0 843.5 L730.1 847.4 L723.8 846.5 Z"/>
    <path d="M172.0 684.5 L177.4 684.1 L182.1 688.9 L180.8 693.9 L175.6 695.8 L170.3 692.3 Z"/>
    <path d="M847.0 657.2 L851.0 655.0 L856.2 657.0 L857.0 661.2 L853.8 664.5 L848.5 663.8 Z"/>
    </g>
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.11"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <!-- a roda -->
  <g filter="url(#wheelShadow)">
    <circle cx="512" cy="512" r="292" fill="url(#tire)"/>
  </g>
  <!-- banda de rodagem -->
  <g fill="#050608" opacity="0.55"><path d="M498.8 222.3 L525.2 222.3 L522.4 242.2 L501.6 242.2 Z"/><path d="M549.4 224.4 L575.3 229.0 L569.1 248.1 L548.6 244.5 Z"/><path d="M598.7 235.3 L623.4 244.3 L614.0 262.0 L594.5 254.9 Z"/><path d="M645.5 254.5 L668.2 267.7 L655.9 283.5 L637.9 273.2 Z"/><path d="M688.1 281.6 L708.3 298.5 L693.4 312.0 L677.5 298.7 Z"/><path d="M725.5 315.7 L742.4 335.9 L725.3 346.5 L712.0 330.6 Z"/><path d="M756.3 355.8 L769.5 378.5 L750.8 386.1 L740.5 368.1 Z"/><path d="M779.7 400.6 L788.7 425.3 L769.1 429.5 L762.0 410.0 Z"/><path d="M795.0 448.7 L799.6 474.6 L779.5 475.4 L775.9 454.9 Z"/><path d="M801.7 498.8 L801.7 525.2 L781.8 522.4 L781.8 501.6 Z"/><path d="M799.6 549.4 L795.0 575.3 L775.9 569.1 L779.5 548.6 Z"/><path d="M788.7 598.7 L779.7 623.4 L762.0 614.0 L769.1 594.5 Z"/><path d="M769.5 645.5 L756.3 668.2 L740.5 655.9 L750.8 637.9 Z"/><path d="M742.4 688.1 L725.5 708.3 L712.0 693.4 L725.3 677.5 Z"/><path d="M708.3 725.5 L688.1 742.4 L677.5 725.3 L693.4 712.0 Z"/><path d="M668.2 756.3 L645.5 769.5 L637.9 750.8 L655.9 740.5 Z"/><path d="M623.4 779.7 L598.7 788.7 L594.5 769.1 L614.0 762.0 Z"/><path d="M575.3 795.0 L549.4 799.6 L548.6 779.5 L569.1 775.9 Z"/><path d="M525.2 801.7 L498.8 801.7 L501.6 781.8 L522.4 781.8 Z"/><path d="M474.6 799.6 L448.7 795.0 L454.9 775.9 L475.4 779.5 Z"/><path d="M425.3 788.7 L400.6 779.7 L410.0 762.0 L429.5 769.1 Z"/><path d="M378.5 769.5 L355.8 756.3 L368.1 740.5 L386.1 750.8 Z"/><path d="M335.9 742.4 L315.7 725.5 L330.6 712.0 L346.5 725.3 Z"/><path d="M298.5 708.3 L281.6 688.1 L298.7 677.5 L312.0 693.4 Z"/><path d="M267.7 668.2 L254.5 645.5 L273.2 637.9 L283.5 655.9 Z"/><path d="M244.3 623.4 L235.3 598.7 L254.9 594.5 L262.0 614.0 Z"/><path d="M229.0 575.3 L224.4 549.4 L244.5 548.6 L248.1 569.1 Z"/><path d="M222.3 525.2 L222.3 498.8 L242.2 501.6 L242.2 522.4 Z"/><path d="M224.4 474.6 L229.0 448.7 L248.1 454.9 L244.5 475.4 Z"/><path d="M235.3 425.3 L244.3 400.6 L262.0 410.0 L254.9 429.5 Z"/><path d="M254.5 378.5 L267.7 355.8 L283.5 368.1 L273.2 386.1 Z"/><path d="M281.6 335.9 L298.5 315.7 L312.0 330.6 L298.7 346.5 Z"/><path d="M315.7 298.5 L335.9 281.6 L346.5 298.7 L330.6 312.0 Z"/><path d="M355.8 267.7 L378.5 254.5 L386.1 273.2 L368.1 283.5 Z"/><path d="M400.6 244.3 L425.3 235.3 L429.5 254.9 L410.0 262.0 Z"/><path d="M448.7 229.0 L474.6 224.4 L475.4 244.5 L454.9 248.1 Z"/></g>
  <circle cx="512" cy="512" r="268" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="512" cy="512" r="253" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="60"/>
  <path d="M263.0 379.6 A282 282 0 0 1 685.6 289.8" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>

