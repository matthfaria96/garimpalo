<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- fundo grafite azulado, mais claro em cima -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3d"/>
      <stop offset="0.55" stop-color="#151821"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="540" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6c453" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#f6c453" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- ouro polido -->
    <linearGradient id="gold" x1="300" y1="290" x2="724" y2="734" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.28" stop-color="#f7cf62"/>
      <stop offset="0.55" stop-color="#d79a2b"/>
      <stop offset="0.8" stop-color="#9c6414"/>
      <stop offset="1" stop-color="#6b420b"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="330" y1="300" x2="694" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.35" stop-color="#f3c14f"/>
      <stop offset="0.7" stop-color="#a86d18"/>
      <stop offset="1" stop-color="#5c380a"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="694" y1="724" x2="330" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#c88b25"/>
      <stop offset="1" stop-color="#6b420b"/>
    </linearGradient>
    <radialGradient id="recess" cx="512" cy="512" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#07080b"/>
      <stop offset="1" stop-color="#1a1c22"/>
    </radialGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3e47"/>
      <stop offset="0.5" stop-color="#1c1e24"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6a0"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- corpo do ícone (grade do macOS: 824 px com cantos contínuos) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- palhetas de ouro: o fundo da bateia -->
    <g fill="url(#gold)" opacity="0.9">
    <path d="M184.7 747.1 L198.3 744.9 L211.1 755.9 L208.8 768.7 L196.3 774.5 L182.3 767.0 Z"/>
