      <path d="M440.5 454.1 L365.5 429.7 A168 168 0 0 1 479.0 347.3 L479.0 426.1 A92 92 0 0 0 440.5 454.1 Z"/>
  </g>
  <g stroke="#fff6cf" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
      <line class="crease" x1="512.0" y1="438.0" x2="512.0" y2="336.0"/>
      <line class="crease" x1="582.4" y1="489.1" x2="679.4" y2="457.6"/>
