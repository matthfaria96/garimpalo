      <line class="crease" x1="441.6" y1="489.1" x2="344.6" y2="457.6"/>
  </g>

  <!-- cubo -->
  <circle cx="512" cy="512" r="64" fill="url(#goldRim)"/>
  <circle cx="512" cy="512" r="54" fill="url(#goldInner)"/>
  <circle cx="535.5" cy="479.6" r="7.5" fill="#3a2a0c"/><circle cx="550.0" cy="524.4" r="7.5" fill="#3a2a0c"/><circle cx="512.0" cy="552.0" r="7.5" fill="#3a2a0c"/><circle cx="474.0" cy="524.4" r="7.5" fill="#3a2a0c"/><circle cx="488.5" cy="479.6" r="7.5" fill="#3a2a0c"/>
  <circle cx="512" cy="512" r="20" fill="url(#gold)" stroke="#5c380a" stroke-opacity="0.5" stroke-width="2"/>

